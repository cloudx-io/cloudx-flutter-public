name: cloudx_flutter_public_demo
description: "Trusted Arbiter interstitial demo for the CloudX Flutter SDK."
publish_to: 'none'

version: 1.0.0+1

# google_mobile_ads 9.1.0 sets both floors.
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  cloudx_flutter: ^3.8.0

  # AdMob is the second bidder in every arbiter round. Pinned exactly so a
  # clone reproduces the same native graph.
  google_mobile_ads: 9.1.0

  # CloudX reads the ATT status but never asks for it, and treats
  # notDetermined the same as denied. The prompt has to be answered before
  # initialize, so the app asks for it itself.
  app_tracking_transparency: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
